name: integration

# Live checks that every wallpaper source still returns a usable image.
# These depend on third-party websites, so they run on a schedule instead of
# gating commits or releases.
#
# Each failing source gets its own "source-check" issue (or a comment on its
# issue if one is already open). It is closed automatically once that source
# passes again.
on:
  schedule:
    - cron: '17 14 * * *' # daily, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open, comment on, and close the tracking issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test sources
        run: |
          set -o pipefail
          npx bats --tap test/integration/sources.bats | tee "$RUNNER_TEMP/sources.tap"

      - name: Update issues
        if: always()
        run: .github/scripts/report-sources.sh "$RUNNER_TEMP/sources.tap"
