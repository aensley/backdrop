name: test

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: Lint
        run: npm run lint

      - name: Install ShellCheck v0.11.0
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: Test
        run: npm test

  desktop:
    name: test (desktop environments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install desktop setting tools and schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus libglib2.0-bin gsettings-desktop-schemas \
            mate-desktop-common cinnamon-desktop-data xfconf libxfconf-0-3

      - name: Test
        run: npx bats test/integration/desktop.bats
        env:
          BACKDROP_REQUIRE_DE_TOOLS: '1'
